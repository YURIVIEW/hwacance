<style>
  :root {
    --page: #DCEFE8;
    --card: #FBFDFC;
    --ink: #22344A;
    --ink-soft: #5B6B7C;
    --line: rgba(34, 52, 74, .12);
    --hud: rgba(251, 253, 252, .84);
    --veil: rgba(220, 239, 232, .62);
    --lav: #CFC6EC;
    --lav-deep: #5E4FAE;
    --butter: #F6E7B8;
    --vacant: #23966F;
    --occupied: #D9443A;
    --primary: #22344A;
    --on-primary: #FBFDFC;
    --font-title: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #16202A;
      --card: #1D2733;
      --ink: #EEF3F7;
      --ink-soft: #A8B5C2;
      --line: rgba(238, 243, 247, .14);
      --hud: rgba(29, 39, 51, .84);
      --veil: rgba(18, 26, 34, .58);
      --lav: #4A4270;
      --lav-deep: #C9C0F2;
      --butter: #5A4F2E;
      --vacant: #4CC79B;
      --occupied: #FF7A6E;
      --primary: #EEF3F7;
      --on-primary: #16202A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #16202A; --card: #1D2733; --ink: #EEF3F7; --ink-soft: #A8B5C2;
    --line: rgba(238, 243, 247, .14); --hud: rgba(29, 39, 51, .84); --veil: rgba(18, 26, 34, .58);
    --lav: #4A4270; --lav-deep: #C9C0F2; --butter: #5A4F2E; --vacant: #4CC79B; --occupied: #FF7A6E;
    --primary: #EEF3F7; --on-primary: #16202A; color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html { overflow: hidden; width: 100%; }
  body {
    position: fixed; inset: 0; width: 100%;
    margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: var(--page); color: var(--ink); font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--lav-deep); outline-offset: 2px; }

  /* 상단 HUD */
  .hud {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0; pointer-events: none;
  }
  .hud > * { pointer-events: auto; }
  .pill {
    background: var(--hud); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 6px 12px; font-size: 14px; line-height: 1.2;
  }
  #timer { grid-column: 1; justify-self: start; font-variant-numeric: tabular-nums; }
  #timer span { font-family: var(--font-title); font-size: 16px; margin-left: 4px; }
  .place {
    grid-column: 2; justify-self: center; font-family: var(--font-title); font-size: 15px; letter-spacing: .04em;
    color: var(--ink); background: var(--hud); border-radius: 999px; padding: 4px 12px;
    border: 1px solid var(--line);
  }
  #sound { grid-column: 3; justify-self: end; width: 40px; height: 40px; padding: 0; font-size: 18px; display: grid; place-items: center; }

  /* 안내 토스트 */
  .toast {
    position: fixed; left: 12px; right: 12px; margin: 0 auto; width: fit-content; max-width: 420px;
    top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 45; text-align: center;   /* 엔딩·확인 창 위에도 보이게 */
    transform: translateY(-6px); opacity: 0; visibility: hidden; transition: opacity .3s, transform .3s, visibility 0s .3s;
    background: var(--hud); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 9px 14px; font-size: 15px; pointer-events: none;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translateY(0); transition: opacity .3s, transform .3s, visibility 0s; }

  /* 복도: 조이스틱(터치 화면) */
  .joy {
    position: fixed; left: 20px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); z-index: 15;
    width: 116px; height: 116px; border-radius: 50%; touch-action: none;
    background: var(--hud); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .joy[hidden] { display: none; }
  .joy .knob {
    position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px;
    border-radius: 50%; background: var(--lav); border: 2px solid var(--lav-deep); pointer-events: none;
  }

  /* 칸 안 UI */
  #stallUI {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  #stallUI[hidden] { display: none; }
  .lockbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .primary {
    background: var(--primary); color: var(--on-primary); border: 0; border-radius: 16px;
    padding: 13px 18px; font-size: 16px; font-weight: 700; min-height: 48px;
  }
  .primary:disabled { opacity: .45; cursor: default; }
  .primary.locked { background: var(--occupied); color: #fff; opacity: 1; }
  .ghost {
    background: var(--hud); border: 1px solid var(--line); border-radius: 16px;
    padding: 13px 15px; font-size: 15px; min-height: 48px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .tray {
    width: min(100%, 460px); border-radius: 20px;
    background: var(--hud); border: 1px solid var(--line);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 6px;
  }
  .tray button {
    border: 0; background: transparent; border-radius: 14px; min-height: 54px; padding: 6px 0 5px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 22px; line-height: 1;
  }
  .tray button span { font-size: 11px; color: var(--ink-soft); }
  .tray button[aria-pressed="true"] { background: var(--lav); }
  .tray button[aria-pressed="true"] span { color: var(--ink); }
  .tray button:disabled { opacity: .35; cursor: default; }

  /* 행동 연출 */
  .fx { position: fixed; inset: 0; z-index: 15; pointer-events: none; opacity: 0; transition: opacity .6s; }
  .fx.on { opacity: 1; }
  #fxPoop { background: radial-gradient(ellipse 110% 70% at 50% 50%, transparent 38%, rgba(217, 68, 58, .32) 100%); display: grid; place-items: center; }
  #fxPoop .strain { text-align: center; }
  #fxPoop b { display: block; font-size: 88px; font-weight: 400; line-height: 1; animation: strain .42s ease-in-out infinite alternate; }
  #fxPoop span { display: block; margin-top: 14px; font-family: var(--font-title); font-size: 26px; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, .45); }
  #fxPoop.done b { animation: poopPop .5s ease-out forwards; }
  @keyframes strain { from { transform: scale(.86) rotate(-5deg); } to { transform: scale(1.08) rotate(5deg); } }
  @keyframes poopPop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1.25); } }
  .hintchip {
    font-size: 13px; background: var(--hud); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  .hintchip[hidden] { display: none; }
  #stallUI.nudging .hintchip { visibility: hidden; }
  .lockbar button.nudge {
    position: relative; background: var(--lav); border-color: var(--lav-deep);
    animation: nudge 1.1s ease-out infinite;
  }
  .lockbar button.nudge::after {
    content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 10px); transform: translateX(-50%);
    white-space: nowrap; font-size: 13px; background: var(--primary); color: var(--on-primary);
    padding: 6px 10px; border-radius: 10px;
  }
  .lockbar button.nudge::before {
    content: ""; position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%);
    border: 6px solid transparent; border-top-color: var(--primary); border-bottom: 0;
  }
  @keyframes nudge {
    0% { box-shadow: 0 0 0 0 rgba(94, 79, 174, .55); }
    70% { box-shadow: 0 0 0 12px rgba(94, 79, 174, 0); }
    100% { box-shadow: 0 0 0 0 rgba(94, 79, 174, 0); }
  }
  #fxZone { background: rgba(255, 255, 255, .2); backdrop-filter: blur(7px) saturate(.8); -webkit-backdrop-filter: blur(7px) saturate(.8); transition: opacity 2.5s; }
  #fxNap { background: radial-gradient(ellipse 120% 62% at 50% 46%, transparent 28%, rgba(10, 14, 20, .88) 74%); transition: opacity 3s; }
  #fxBreath { display: grid; place-items: center; background: rgba(20, 28, 36, .18); }
  #fxBreath .ring {
    width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center;
    border: 3px solid rgba(255, 255, 255, .92); background: rgba(207, 198, 236, .38);
    transform: scale(.65); transition: transform 4s ease-in-out;
  }
  #fxBreath .ring.big { transform: scale(1.45); }
  #fxBreath span { font-family: var(--font-title); color: #fff; font-size: 18px; text-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
  #fxTiles { display: flex; justify-content: center; padding-top: calc(env(safe-area-inset-top, 0px) + 96px); }
  #fxTiles div { text-align: center; color: #22344A; font-family: var(--font-title); text-shadow: 0 1px 8px rgba(255, 255, 255, .9); }
  #fxTiles strong { display: block; font-size: 60px; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; }
  #fxTiles span { font-size: 15px; }

  /* 시작 화면 */
  .start {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 56px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
    background: var(--veil); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    transition: opacity .5s;
  }
  .start.leaving { opacity: 0; pointer-events: none; }
  .card {
    width: 100%; max-width: 360px; margin: auto; background: var(--card); border-radius: 28px;
    border: 1px solid var(--line); padding: 26px 22px 22px;
    box-shadow: 0 18px 50px -24px rgba(34, 52, 74, .45);
  }
  .sign {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--vacant);
    border: 1.5px solid currentColor; border-radius: 999px; padding: 4px 10px 4px 8px;
  }
  .sign .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  h1 {
    font-family: var(--font-title); font-weight: 400; font-size: 64px; line-height: 1;
    margin: 18px 0 6px; letter-spacing: -.01em;
  }
  .sub { margin: 0 0 24px; font-size: 17px; color: var(--ink-soft); }
  .field { margin-bottom: 18px; }
  .field > .label, .field > label { display: block; font-size: 14px; color: var(--ink-soft); margin-bottom: 8px; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .roles button {
    border: 1.5px solid var(--line); background: transparent; border-radius: 18px;
    padding: 12px 8px; font-size: 30px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .roles button span { font-size: 16px; font-family: var(--font-title); }
  .roles button[aria-pressed="true"] { border-color: var(--lav-deep); background: var(--lav); }
  .nickrow { display: flex; gap: 8px; }
  .nickrow input {   /* 닉네임은 🎲 조합만 — 직접 입력은 받지 않고 보여 주기만 */
    flex: 1; min-width: 0; font: inherit; font-size: 18px; color: var(--ink);
    background: transparent; border: 1.5px solid var(--line); border-radius: 14px; padding: 11px 13px;
    cursor: default; outline: none;
  }
  .field > label small { font-size: 12px; opacity: .8; }
  .nickrow button {
    width: 50px; border: 1.5px solid var(--line); background: var(--butter); border-radius: 14px; font-size: 22px;
  }
  .field[hidden] { display: none; }
  .look { display: flex; gap: 12px; align-items: center; }
  #lookCanvas { width: 84px; height: 112px; flex: none; border-radius: 16px; background: var(--page); }
  .swatches { display: grid; gap: 10px; min-width: 0; }
  .swrow { display: flex; flex-wrap: wrap; gap: 6px; }
  .swrow small { width: 100%; font-size: 12px; color: var(--ink-soft); margin-bottom: -2px; }
  .sw {
    width: 30px; height: 30px; padding: 0; border-radius: 50%;
    border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line);
  }
  .sw[aria-checked="true"] { box-shadow: 0 0 0 2.5px var(--lav-deep); }
  .big { width: 100%; margin-top: 4px; }
  .hud-right { grid-column: 3; justify-self: end; display: flex; gap: 6px; }
  #timer:not([hidden]) ~ .place { visibility: hidden; }   /* 타이머에 이미 '화캉스'가 있어 좁은 화면에서 겹치지 않게 */
  #voice, #music { width: 40px; height: 40px; padding: 0; font-size: 18px; display: grid; place-items: center; }
  #voice[aria-pressed="false"], #music[aria-pressed="false"] { opacity: .5; }

  /* 문 밖 아이 */
  .kid {
    position: fixed; left: 16px; right: 16px; top: 34%; z-index: 18; margin: 0 auto; width: fit-content; max-width: 320px;
    background: #FFF8E1; color: #22344A; border: 2.5px solid #22344A; border-radius: 24px; padding: 8px 20px 12px;
    text-align: center; pointer-events: none; opacity: 0; transform: scale(.85); transition: opacity .2s, transform .2s;
  }
  .kid.on { opacity: 1; transform: scale(1); }
  .kid small { display: block; font-size: 12px; color: #5B6B7C; margin-bottom: 2px; }
  .kid span { font-family: var(--font-title); font-size: 24px; }
  .kid.loud span { font-size: 32px; }
  .kid.loud.on { animation: kidShake .32s 2; }
  .kid::after {
    content: ""; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%);
    border: 12px solid transparent; border-top-color: #22344A; border-bottom: 0;
  }
  @keyframes kidShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .choice {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 22; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 18px);
  }
  .choice[hidden] { display: none; }

  /* 엔딩 카드 */
  .ending {
    position: fixed; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    padding: calc(env(safe-area-inset-top, 0px) + 60px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: var(--veil); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .ending[hidden] { display: none; }
  .ending img {
    display: block; max-width: 100%; max-height: calc(100% - 150px); width: auto; height: auto;   /* 아래 버튼 줄 + 링크 두 줄 자리 */
    border-radius: 22px; box-shadow: 0 18px 50px -20px rgba(34, 52, 74, .5);
    -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto;
  }
  .ending p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .linkish {
    background: none; border: 0; padding: 8px 10px; min-height: 40px; font-size: 14px; color: var(--ink);
    text-decoration: underline; text-underline-offset: 3px;
  }
  .linkish[hidden] { display: none; }
  .ending .row { display: flex; gap: 8px; }

  /* 쉼 기록 달력 + 칭호 도감 */
  .records {
    position: fixed; inset: 0; z-index: 42; display: flex; overflow-y: auto;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 14px calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: rgba(20, 28, 36, .38);
  }
  .records[hidden] { display: none; }
  .records .card { margin: auto; padding: 20px 18px 16px; }
  .rec-head { display: flex; justify-content: space-between; align-items: center; }
  .records h2, .records h3 { font-family: var(--font-title); font-weight: 400; margin: 0; }
  .records h2 { font-size: 26px; }
  .records h3 { font-size: 20px; margin: 18px 0 10px; }
  .records h3 small { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); }
  #recClose { width: 40px; height: 40px; padding: 0; font-size: 16px; display: grid; place-items: center; }
  .rec-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 14px 0 12px; }
  .rec-sum div { background: var(--page); border-radius: 14px; padding: 8px 4px; text-align: center; }
  .rec-sum strong { display: block; font-family: var(--font-title); font-weight: 400; font-size: 21px; white-space: nowrap; }
  .rec-sum span { font-size: 12px; color: var(--ink-soft); }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cal-nav button { width: 36px; height: 36px; padding: 0; border: 0; background: transparent; font-size: 22px; color: var(--ink); border-radius: 50%; }
  .cal-nav button:disabled { opacity: .2; }
  .cal-nav strong { font-family: var(--font-title); font-weight: 400; font-size: 18px; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
  .cal .wd { font-size: 11px; color: var(--ink-soft); padding: 2px 0; }
  .cal .d { aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; font-size: 13px; position: relative; font-variant-numeric: tabular-nums; }
  .cal .d.on { background: var(--vacant); color: #fff; }
  .cal .d.today { box-shadow: inset 0 0 0 1.5px var(--lav-deep); }

<script type="module">
import * as THREE from 'three';

const $ = (s) => document.querySelector(s);
const V3 = THREE.Vector3;
const clamp = THREE.MathUtils.clamp;

/* ---------- 저장소 ---------- */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- 상태 ---------- */
const app = {
  state: 'start',            // start | corridor | entering | stall | leaving
  stall: -1,
  locked: false,
  lockStart: 0,
  role: null,
  nickname: '',
};
window.hwacance = app;       // 다음 단계에서 엄마/아빠, 닉네임을 쓰기 위해
// 방문 통계(구글 애널리틱스) 이벤트 — 닉네임 등 개인 정보는 보내지 않고 행동·숫자만. GA가 꺼져 있으면 아무 일도 안 함
const track = (name, params = {}) => { try { window.gtag('event', name, params); } catch (e) { /* 통계 실패는 무시 */ } };

/* ---------- 렌더러 ---------- */
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#DCEFE8');
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 60);
camera.rotation.order = 'YXZ';
app.camera = camera;   // 디버그용

scene.add(new THREE.HemisphereLight(0xffffff, 0xBFD9CE, 1.55));
const sun = new THREE.DirectionalLight(0xFFF6EA, 1.0);
sun.position.set(2, 5, 6);
scene.add(sun);
const stallLight = new THREE.PointLight(0xFFF1DC, 0, 3.4, 1);
scene.add(stallLight);

/* ---------- 텍스처 ---------- */
function canvasTex(w, h, draw, rx = 1, ry = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = 4;
  t.userData = { canvas: c, g };
  return t;
}
function drawTiles(g, w, n, colors, grout, gap, jitter = 0) {
  g.fillStyle = grout; g.fillRect(0, 0, w, w);
  const s = w / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const base = colors[(x + y) % colors.length];
    g.fillStyle = base; g.fillRect(x * s + gap / 2, y * s + gap / 2, s - gap, s - gap);
    if (jitter) {
      g.fillStyle = `rgba(255,255,255,${Math.random() * jitter})`;
      g.fillRect(x * s + gap / 2, y * s + gap / 2, s - gap, s - gap);
    }
  }
}
const wallTex = (rx, ry) => canvasTex(512, 512, (g, w) => drawTiles(g, w, 8, ['#BFE3D6', '#C4E6DA'], '#F3F9F6', 6, 0.14), rx, ry);
const floorTex = (rx, ry) => canvasTex(512, 512, (g, w) => drawTiles(g, w, 4, ['#EAF4EF', '#D3E9DE'], '#C2D9CE', 5), rx, ry);

/* ---------- 재질 ---------- */
const M = {
  part: new THREE.MeshLambertMaterial({ color: '#F6E7B8' }),
  door: new THREE.MeshLambertMaterial({ color: '#CFC6EC' }),
  metal: new THREE.MeshLambertMaterial({ color: '#C3CCD3' }),
  porcelain: new THREE.MeshLambertMaterial({ color: '#FFFFFF' }),
  dark: new THREE.MeshLambertMaterial({ color: '#5A6876' }),
  ceiling: new THREE.MeshLambertMaterial({ color: '#F7FBF9' }),
  paper: new THREE.MeshLambertMaterial({ color: '#FFFDF7' }),
  pot: new THREE.MeshLambertMaterial({ color: '#F2D2C2' }),
  leaf: new THREE.MeshLambertMaterial({ color: '#79B98E' }),
  lamp: new THREE.MeshBasicMaterial({ color: '#FFFDF4' }),
};

function box(w, h, d, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); parent.add(m); return m;
}
function cyl(rt, rb, h, mat, x, y, z, parent = scene, seg = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); parent.add(m); return m;
}
function plane(w, h, mat, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); parent.add(m); return m;
}

/* ---------- 방 ---------- */
const ROOM = { x: 4, back: -1.7, front: 9, h: 3 };
const floor = plane(ROOM.x * 2, ROOM.front - ROOM.back,
  new THREE.MeshLambertMaterial({ map: floorTex(5, 6.7) }), 0, 0, (ROOM.front + ROOM.back) / 2);
floor.rotation.x = -Math.PI / 2;
const TILE = 0.3;   // 천장 타일 한 장 크기 (m)
const ceilTex = canvasTex(512, 512, (g, w) => {
  drawTiles(g, w, 4, ['#F6FAF9'], '#D3DFDA', 6);
  g.fillStyle = 'rgba(140, 160, 155, .28)';
  const s = w / 4;
  for (let ty = 0; ty < 4; ty++) for (let tx = 0; tx < 4; tx++) for (let i = 0; i < 16; i++) {
    g.fillRect(tx * s + 12 + Math.random() * (s - 24), ty * s + 12 + Math.random() * (s - 24), 2, 2);
  }
}, (ROOM.x * 2) / (TILE * 4), (ROOM.front - ROOM.back) / (TILE * 4));
const ceil = plane(ROOM.x * 2, ROOM.front - ROOM.back, new THREE.MeshLambertMaterial({ map: ceilTex }), 0, ROOM.h, (ROOM.front + ROOM.back) / 2);
ceil.rotation.x = Math.PI / 2;
plane(ROOM.x * 2, ROOM.h, new THREE.MeshLambertMaterial({ map: wallTex(6.7, 2.5) }), 0, ROOM.h / 2, ROOM.back);
const fw = plane(ROOM.x * 2, ROOM.h, new THREE.MeshLambertMaterial({ map: wallTex(6.7, 2.5) }), 0, ROOM.h / 2, ROOM.front);
fw.rotation.y = Math.PI;
for (const s of [-1, 1]) {
  const sw = plane(ROOM.front - ROOM.back, ROOM.h, new THREE.MeshLambertMaterial({ map: wallTex(8.9, 2.5) }),
    s * ROOM.x, ROOM.h / 2, (ROOM.front + ROOM.back) / 2);
  sw.rotation.y = -s * Math.PI / 2;
}
// 뒷벽 높은 곳의 불투명 창 (칸막이 위로 보이는 빛)
const frost = canvasTex(512, 64, (g, w, h) => {
  g.fillStyle = '#F2FAFF'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(190,220,235,.35)';
  for (let x = 0; x < w; x += 64) g.fillRect(x, 0, 4, h);
});
plane(5.6, 0.36, new THREE.MeshBasicMaterial({ map: frost }), 0, 2.55, ROOM.back + 0.01);
// 천장 조명
for (const [x, z] of [[-1.6, 2.4], [1.6, 2.4], [0, 5.6]]) {
  const l = new THREE.Mesh(new THREE.CircleGeometry(0.26, 32), M.lamp);
  l.position.set(x, ROOM.h - 0.005, z); l.rotation.x = Math.PI / 2; scene.add(l);
}
// 화분
for (const s of [-1, 1]) {
  const px = s * 3.35, pz = -1.1;
  cyl(0.24, 0.18, 0.42, M.pot, px, 0.21, pz);
  for (const [dx, dy, dz, r] of [[0, 0.72, 0, 0.3], [0.15, 0.95, 0.05, 0.22], [-0.14, 0.9, -0.04, 0.21], [0.02, 1.12, 0, 0.17]]) {
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), M.leaf);
    b.position.set(px + dx, dy, pz + dz); scene.add(b);
  }
}
// 세면대와 거울 (가로 화면에서 보임)
box(0.6, 0.08, 2.4, M.porcelain, -ROOM.x + 0.3, 0.86, 3.6);
for (const z of [3.0, 4.2]) {
  const basin = cyl(0.2, 0.16, 0.1, M.porcelain, -ROOM.x + 0.32, 0.93, z);
  basin.scale.z = 0.8;
  cyl(0.02, 0.02, 0.22, M.metal, -ROOM.x + 0.08, 1.02, z);
}
plane(2.2, 0.9, new THREE.MeshBasicMaterial({ color: '#DDEEF6' }), -ROOM.x + 0.01, 1.62, 3.6).rotation.y = Math.PI / 2;

/* ---------- 캐릭터 (preview/character.html과 같은 코드 — 고칠 때 둘 다 맞출 것) ----------
   발바닥이 원점, 얼굴은 +z. 서 있는 키 약 1.3m.
   makeCharacter({ role, shirt, slipper }) → 부품 묶음, poseCharacter(ch, pose, t, dt)는 매 프레임 호출 */
const SHIRT_NAMES = ['코랄', '하늘', '버터', '민트', '라벤더', '아이보리'];
const SLIPPER_NAMES = ['민트', '노랑', '보라', '분홍', '파랑'];
const SKIN = '#F6C9A8', HAIR = '#4A3A33', PANTS = '#7D8798';
// 고를 수 있는 색 (번호로 서버에 보냄). 처음 기본값은 엄마 0번 코랄, 아빠 1번 하늘색
const SHIRTS = ['#F4978E', '#8EC5F0', '#F6D27A', '#9ED9B5', '#C3AEEB', '#F3EFE6'];
const SLIPPERS = ['#7FC8A9', '#F2C94C', '#B79CED', '#F28FB0', '#6FA8DC'];
const DEFAULT_SHIRT = { mom: 0, dad: 1 };
const SEAT_Y = 0.28;   // 캐릭터에 맞춘 낮은 변기 높이 (발이 바닥 가까이 닿게)
const LEG = { hip: 0.36, thigh: 0.15, shin: 0.15 };
const SIT_TILT = 0.3;   // 앉았을 때 허벅지가 앞으로 살짝 내려가는 각도

function makeCharacter({ role = 'mom', shirt: shirtColor = SHIRTS[DEFAULT_SHIRT[role]], slipper = SLIPPERS[0] } = {}) {
  const mat = (color, extra) => new THREE.MeshLambertMaterial({ color, ...extra });
  const mesh = (geo, m, x = 0, y = 0, z = 0, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); parent.add(o); return o; };
  const skin = mat(SKIN), shirt = mat(shirtColor), pants = mat(PANTS), hair = mat(HAIR);
  const black = new THREE.MeshBasicMaterial({ color: '#2A2522' });
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);   // 앉기·떨림은 body를 움직임

  // 다리: 엉덩이 축 → 허벅지 → 무릎 축 → 정강이 → 슬리퍼
  const slipperMat = mat(slipper);
  const legs = [-1, 1].map((s) => {
    const hip = new THREE.Group(); hip.position.set(s * 0.085, LEG.hip, 0); body.add(hip);
    mesh(new THREE.CylinderGeometry(0.058, 0.055, LEG.thigh, 14), pants, 0, -LEG.thigh / 2, 0, hip);
    const knee = new THREE.Group(); knee.position.y = -LEG.thigh; hip.add(knee);
    mesh(new THREE.CylinderGeometry(0.055, 0.05, LEG.shin, 14), pants, 0, -LEG.shin / 2, 0, knee);
    const sl = mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.035, 18), slipperMat, 0, -LEG.shin - 0.022, 0.035, knee);
    sl.scale.z = 1.55;   // 납작하고 긴 슬리퍼
    return { hip, knee, slipper: sl };
  });

  // 몸통: 둥근 캡슐 상의
  const torso = mesh(new THREE.CapsuleGeometry(0.175, 0.16, 6, 18), shirt, 0, 0.58, 0, body);
  torso.scale.z = 0.85;

  // 어깨 축 (숨 고르기 때 오르내림) + 팔
  const shoulders = new THREE.Group(); shoulders.position.y = 0.73; body.add(shoulders);
  const arms = [-1, 1].map((s) => {
    const pivot = new THREE.Group(); pivot.position.set(s * 0.175, 0, 0); shoulders.add(pivot);
    mesh(new THREE.CylinderGeometry(0.045, 0.042, 0.22, 12), shirt, 0, -0.11, 0, pivot);
    mesh(new THREE.SphereGeometry(0.055, 14, 10), skin, 0, -0.245, 0, pivot);
    pivot.rotation.z = s * 0.14;
    return pivot;
  });

  // 머리 (목 축에서 끄덕임)
  const head = new THREE.Group(); head.position.y = 0.82; body.add(head);
  const HR = 0.24, HY = 0.21;
  mesh(new THREE.SphereGeometry(HR, 32, 24), skin, 0, HY, 0, head);

const SEATED = new Set(['sit', 'nap', 'zone', 'poop', 'video', 'book', 'breath', 'tiles', 'alert', 'hush']);
// 각 관절의 목표 각도를 정하고 부드럽게 따라가게 함
function poseCharacter(ch, pose, t, dt) {
  const seated = SEATED.has(pose);
  const g = {   // 목표값
    bodyY: seated ? SEAT_Y + 0.045 - LEG.hip : 0, bodyX: 0,
    hip: seated ? -(Math.PI / 2 - SIT_TILT) : 0, knee: seated ? Math.PI / 2 - SIT_TILT : 0,
    hipSwing: 0, kneeSwing: 0, arm: seated ? -0.25 : 0, armIn: 0,
    head: 0, headTilt: 0, shoulderY: 0.73, torsoS: 1,
  };
  let eyes = 'open';
  if (pose === 'walk') {
    const w = Math.sin(t * 9);
    g.hipSwing = w * 0.55; g.kneeSwing = Math.max(0, -w) * 0.5;
    g.arm = -w * 0.6; g.bodyY = Math.abs(Math.cos(t * 9)) * 0.03;
  } else if (pose === 'stand') {
    g.shoulderY += Math.sin(t * 1.6) * 0.006;
  } else if (pose === 'nap') {   // 고개 꾸벅꾸벅
    const nod = Math.pow(Math.max(0, Math.sin(t * 0.9)), 6);
    g.head = 0.28 + nod * 0.32 + Math.sin(t * 2.2) * 0.04; eyes = 'closed';
    g.arm = -0.15;
  } else if (pose === 'zone') {   // 가만히, 고개 살짝 기울임
    g.headTilt = 0.12; g.head = -0.08; g.arm = -0.1;
  } else if (pose === 'poop') {   // 부들부들
    g.bodyX = (Math.random() - 0.5) * 0.012; eyes = 'squeeze';
    g.arm = -0.5; g.armIn = 0.25; g.shoulderY += 0.02; g.head = 0.1;
  } else if (pose === 'video') {   // 폰 들고 고개 숙임
    g.arm = -1.05; g.armIn = 0.42; g.head = 0.42;
  } else if (pose === 'book') {   // 두 손으로 책을 펼쳐 들고 내려다봄
    g.arm = -0.95; g.armIn = 0.34; g.head = 0.5;
  } else if (pose === 'breath') {   // 4초 들이쉬고 4초 내쉬기
    const b = Math.sin((t * Math.PI) / 4);
    g.shoulderY += b * 0.035; g.torsoS = 1 + b * 0.04; g.head = -0.05 - b * 0.05;
  } else if (pose === 'tiles') {   // 고개 숙여 발 앞 바닥 보기
    g.head = 0.62; g.arm = -0.2;
  } else if (pose === 'alert') {   // 문 밖 아이 소리에 깜짝: 고개 들고 어깨 움찔
    g.head = -0.16; g.shoulderY += 0.02; g.arm = -0.3;
  } else if (pose === 'hush') {   // 숨죽이기: 몸을 웅크리고 고개 숙임
    g.head = 0.3; g.shoulderY += 0.035; g.arm = -0.55; g.armIn = 0.32;
  }
  const c = ch.cur, k = Math.min(1, dt * 10);
  for (const key in g) c[key] = c[key] === undefined ? g[key] : c[key] + (g[key] - c[key]) * k;
  const fast = pose === 'walk' || pose === 'poop';   // 걷기·떨림은 바로 적용
  ch.body.position.set(fast ? g.bodyX : c.bodyX, fast ? g.bodyY : c.bodyY, 0);
  ch.legs.forEach((l, i) => {
    const s = i === 0 ? 1 : -1;
    l.hip.rotation.x = c.hip + (fast ? g.hipSwing : c.hipSwing) * s;
    l.knee.rotation.x = c.knee + (fast ? (s > 0 ? g.kneeSwing : Math.max(0, Math.sin(t * 9)) * 0.5) : c.kneeSwing);
  });
  ch.arms.forEach((a, i) => {
    const s = i === 0 ? -1 : 1;
    a.rotation.x = pose === 'walk' ? g.arm * s : c.arm;
    a.rotation.z = s * (0.14 - c.armIn);
  });
  ch.shoulders.position.y = c.shoulderY;
  ch.torso.scale.y = c.torsoS;
  ch.head.rotation.x = c.head;
  ch.head.rotation.z = c.headTilt;
  ch.eyesOpen.visible = eyes === 'open';
  ch.eyesClosed.visible = eyes === 'closed';
  ch.eyesSqueeze.visible = eyes === 'squeeze';
  ch.phone.visible = pose === 'video';
  ch.book.visible = pose === 'book';
  if (ch.book.visible) {   // 무릎 위 두 손 사이, 표지가 앞(위)에서 보이게 살짝 젖힘
    ch.book.position.set(0, 0.56, 0.29);
    ch.book.rotation.x = -0.35;
  }
  if (ch.phone.visible) {   // 두 손 사이, 얼굴 앞
    ch.phone.position.set(0, 0.6, 0.3);
    ch.phone.rotation.x = -0.55;
  }
}

const tmpCam = new THREE.PerspectiveCamera();
function lookQ(p, t) { tmpCam.position.copy(p); tmpCam.lookAt(t); return tmpCam.quaternion.clone(); }
function corridorPose() {
  const a = camera.aspect;
  const vf = a < 1 ? 68 : 52;
  const half = THREE.MathUtils.degToRad(vf / 2);
  const d = clamp(3.1 / (Math.tan(half) * a), 4.2, 8.6);
  const p = new V3(0, 1.55, d);
  return { p, q: lookQ(p, new V3(0, 1.15, -0.8)), fov: vf };
}
// 칸 안 카메라: 내 칸 문 바로 안쪽 위에서 앉은 캐릭터를 비스듬히 내려다봄 (고정)

}
function applyCorridor() {
  const c = corridorPose();

const tweens = [];
const ease = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
function tween(delay, dur, fn) {
  return new Promise((res) => tweens.push({ start: performance.now() + delay * 1000, dur: dur * 1000, fn, res }));
}
function runTweens(now) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    const k = (now - tw.start) / tw.dur;
    if (k < 0) continue;
    tw.fn(ease(Math.min(1, k)));
    if (k >= 1) { tweens.splice(i, 1); tw.res(); }
  }
}

/* ---------- 소리 (Web Audio 합성) ---------- */
let ac = null, master = null, fanGain = null, whiteBuf = null;
let soundOn = store.get('hwacance.sound') !== false;
let fanLevel = 0.2;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  master = ac.createGain(); master.gain.value = soundOn ? 1 : 0; master.connect(ac.destination);
  const sr = ac.sampleRate;
  // 흰 소음 (효과음용)
  whiteBuf = ac.createBuffer(1, sr, sr);
  const wd = whiteBuf.getChannelData(0);
  for (let i = 0; i < sr; i++) wd[i] = Math.random() * 2 - 1;
  // 갈색 소음 (환풍기용) — 끝을 앞에 겹쳐 이음매 없이 반복
  const len = sr * 4, X = Math.floor(sr * 0.25);
  const buf = ac.createBuffer(1, len, sr);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
  for (let i = 0; i < X; i++) { const k = i / X; d[i] = d[i] * k + d[len - X + i] * (1 - k); }
  const src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.loopEnd = (len - X) / sr;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260; lp.Q.value = 0.6;
  fanGain = ac.createGain(); fanGain.gain.value = 0;
  src.connect(lp).connect(fanGain);
  for (const [f, v] of [[98, 0.035], [196, 0.012]]) {
    const o = ac.createOscillator(); o.frequency.value = f;
    const og = ac.createGain(); og.gain.value = v; o.connect(og).connect(fanGain); o.start();
  }
  const lfo = ac.createOscillator(); lfo.frequency.value = 0.23;
  const lg = ac.createGain(); lg.gain.value = 0.03; lfo.connect(lg).connect(fanGain.gain); lfo.start();
  fanGain.connect(master);
  src.start();
  setFan(fanLevel, 1.5);
}
function setFan(v, t = 1) {
  fanLevel = v;
  if (!ac) return;
  fanGain.gain.cancelScheduledValues(ac.currentTime);
  fanGain.gain.setTargetAtTime(v, ac.currentTime, t / 3);
}
function noiseBurst(t, dur, freq, type, gain, freqTo, dest = master) {
  const n = ac.createBufferSource(); n.buffer = whiteBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t);
  if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.01, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  n.connect(f).connect(g).connect(dest);
  n.start(t); n.stop(t + dur + 0.05);
}
function tone(t, dur, f0, f1, type, gain, dest = master) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain();
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t + dur + 0.05);
}
function panNode(p) {
  if (!ac.createStereoPanner) return master;
  const pn = ac.createStereoPanner(); pn.pan.value = p; pn.connect(master); return pn;
}
const sfx = {
  click() { if (!ac) return; const t = ac.currentTime;      // 딸-깍

  swoosh() { if (!ac) return; noiseBurst(ac.currentTime, 0.45, 300, 'bandpass', 0.14, 1100); },
  thud() { if (!ac) return; const t = ac.currentTime;

  tap() { if (!ac) return; tone(ac.currentTime, 0.06, 880, 660, 'sine', 0.06); },

  steps(approach = true, scale = 1) {

  wash() { if (!ac) return; const t = ac.currentTime;   // 손 씻는 물소리

    tone(t + 1.3, 0.18, 110, 45, 'sine', 0.3 * vol, out); noiseBurst(t + 1.3, 0.08, 400, 'lowpass', 0.2 * vol, null, out); },
  flush(pan = 0, vol = 1) { if (!ac) return; const t = ac.currentTime, out = panNode(pan);     // 레버 + 쏴아아 + 꾸르륵
    noiseBurst(t, 0.1, 1200, 'bandpass', 0.35 * vol, null, out); tone(t, 0.08, 500, 300, 'triangle', 0.08 * vol, out);
    const n = ac.createBufferSource(); n.buffer = whiteBuf; n.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass';

    f.frequency.linearRampToValueAtTime(2200, t + 0.6);

/* 칸 안 배경음악 — 합성 로파이 재즈 (참고곡 'Brass Teacup' 분석: 64박/분, B♭ 장조, 재즈 화음, 고음을 깎은 따뜻한 소리, 잔잔한 비트).
   전자피아노(로즈) 화음 + 둥근 베이스 + 부드러운 킥·브러시 + 가끔 약음 브라스 한 소절 + 아주 옅은 레코드 지직거림.
   문을 잠그면 서서히 들어오고 환풍기 소리는 줄어듦. 물 내리면 서서히 사라짐 */
let musicOn = store.get('hwacance.music') !== false;   // 기본은 켜짐
const music = { bus: null, playing: false, timer: 0, t0: 0, step: 0 };
app.music = music;   // 디버그용
const BEAT = 60 / 64;   // 1분에 64박
const SWING = 0.62;     // 8분음표 뒷박을 살짝 늦게 (스윙)
// 8마디 화음 흐름 (반 마디 단위). keys: 전자피아노 음(으뜸음을 넣어 B♭ 장조가 또렷하게), bass: 베이스 바탕음
const CH = {
  Ebmaj7: { keys: [63, 67, 70, 74], bass: 39 },   // E♭ G B♭ D  (참고곡처럼 가운데 음역 250~600Hz)
  Dm7: { keys: [62, 65, 69, 72], bass: 38 },      // D F A C
  Cm7: { keys: [60, 63, 67, 70], bass: 36 },      // C E♭ G B♭
  F7: { keys: [60, 63, 65, 69], bass: 41 },       // C E♭ F A
  Bbmaj7: { keys: [58, 62, 65, 69], bass: 46 },   // B♭ D F A
  Gm7: { keys: [62, 65, 67, 70], bass: 43 },      // D F G B♭
};
const PROG = ['Ebmaj7', 'Ebmaj7', 'Dm7', 'Dm7', 'Cm7', 'F7', 'Bbmaj7', 'Bbmaj7',
  'Gm7', 'Gm7', 'Cm7', 'Cm7', 'F7', 'F7', 'Bbmaj7', 'Bbmaj7'];
// 브라스 한 소절 [음, 박] — B♭ 장조 안에서 느긋하게 내려오거나 올라감 (0이면 쉼)
const MOTIFS = [
  [[74, 1], [72, 0.5], [70, 1.5], [67, 1]],
  [[65, 0.5], [67, 0.5], [70, 1], [72, 1], [74, 2]],
  [[77, 1], [74, 1], [72, 0.5], [70, 2.5]],
  [[70, 0.5], [72, 0.5], [74, 1], [0, 0.5], [72, 0.5], [70, 2]],
];
const FAN_STALL = 0.34, FAN_MUSIC = 0.16;
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
function musicBus() {
  if (music.bus) return music.bus;
  const bus = ac.createGain(); bus.gain.value = 0;
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2300; lp.Q.value = 0.5;   // 로파이: 날카로운 고음을 깎아 따뜻하게
  const delay = ac.createDelay(1); delay.delayTime.value = 0.23;
  const fb = ac.createGain(); fb.gain.value = 0.15;
  const wet = ac.createGain(); wet.gain.value = 0.08;   // 작은 방 울림 정도
  bus.connect(lp).connect(master);
  lp.connect(delay); delay.connect(fb).connect(delay); delay.connect(wet).connect(master);
  music.bus = bus;
  return bus;
}
function rhodes(t, m, vol, dur) {   // 전자피아노: 둥근 기음 + 짧게 반짝이는 쇠 소리
  const o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = mtof(m);
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(vol * 0.45, t + 0.7);
  g.gain.setValueAtTime(vol * 0.45, t + dur);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);
  o.connect(g).connect(music.bus); o.start(t); o.stop(t + dur + 0.6);
  const p = ac.createOscillator(); p.type = 'sine'; p.frequency.value = mtof(m) * 4;   // 건반 칠 때 '팅'
  const pg = ac.createGain();
  pg.gain.setValueAtTime(vol * 0.12, t); pg.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  p.connect(pg).connect(music.bus); p.start(t); p.stop(t + 0.3);
}
function comp(t, name, vol, dur) {   // 화음을 살짝 흩어서(아래부터) 치기
  CH[name].keys.forEach((m, i) => rhodes(t + i * 0.018, m, vol, dur));
}
function bassNote(t, m, dur) {   // 둥근 베이스
  for (const [type, v] of [['sine', 0.042], ['triangle', 0.016]]) {
    const o = ac.createOscillator(); o.type = type; o.frequency.value = mtof(m);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.02);
    g.gain.exponentialRampToValueAtTime(v * 0.6, t + dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(music.bus); o.start(t); o.stop(t + dur + 0.05);
  }
}
function brass(t, m, dur, vol) {   // 약음기 낀 플루겔혼 느낌: 톱니파를 낮게 거르고 천천히 부풀림 + 살짝 떨림
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 950; lp.Q.value = 0.9;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.08);
  g.gain.setValueAtTime(vol, t + Math.max(0.1, dur - 0.15));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.2);
  lp.connect(g).connect(music.bus);
  const vib = ac.createOscillator(); vib.frequency.value = 5;
  const vg = ac.createGain(); vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(5, t + 0.4);   // 소리가 이어질 때만 떨림
  vib.connect(vg);
  for (const det of [-5, 5]) {
    const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m); o.detune.value = det;
    vg.connect(o.detune);
    o.connect(lp); o.start(t); o.stop(t + dur + 0.25);
  }
  vib.start(t); vib.stop(t + dur + 0.25);
}
// 분위기: 쪽잠은 화음만 조용히, 멍은 브라스 없이, 문 밖에 아이가 오면 아이 목소리가 들리게 줄임
function musicMood() {
  const nap = app.action === 'nap', zone = app.action === 'zone';
  const m = { vol: nap ? 0.6 : zone ? 0.85 : 1, drums: !nap, horn: !nap && !zone };
  if (app.kid) m.vol *= 0.35;
  return m;
}
// 8분음표 단위 시간 (뒷박은 스윙만큼 늦게)
const stepTime = (k) => music.t0 + Math.floor(k / 2) * BEAT + (k % 2 ? BEAT * SWING : 0);
function musicStep(k, mood) {
  const t = stepTime(k), s = k % 8, bar = Math.floor(k / 8);
  const half = PROG[(bar * 2 + (s >= 4 ? 1 : 0)) % PROG.length], prevHalf = PROG[(bar * 2 + (s >= 4 ? 0 : -1) + PROG.length) % PROG.length];
  const ch = CH[half];
  // 전자피아노: 마디 첫 박, 반 마디에 화음이 바뀌면 3박, 홀수 마디는 2박 뒷박에 살짝 한 번 더
  if (s === 0) comp(t, half, 0.06, BEAT * (PROG[(bar * 2 + 1) % PROG.length] === half ? 3.6 : 1.8));   // 한 마디 내내 같은 화음이면 길게
  else if (s === 4 && half !== prevHalf) comp(t, half, 0.056, BEAT * 1.8);
  else if (s === 3 && bar % 2 && mood.drums) comp(t, half, 0.034, BEAT * 0.8);
  // 베이스: 1박, 2박 뒷박, 3박 (킥과 같은 자리)
  if (s === 0) bassNote(t, ch.bass, BEAT * 1.3);
  else if (s === 3) bassNote(t, ch.bass, BEAT * 0.45);
  else if (s === 4) bassNote(t, ch.bass + (half === prevHalf ? 7 : 0), BEAT * 1.2);
  if (mood.drums) {
    if (s === 0 || s === 3 || s === 4) tone(t, 0.14, 105, 48, 'sine', s === 3 ? 0.05 : 0.075, music.bus);   // 부드러운 킥
    if (s === 2 || s === 6) noiseBurst(t, 0.14, 1900, 'bandpass', 0.045, 1200, music.bus);   // 2·4박 브러시
    noiseBurst(t, 0.035, 3400, 'bandpass', s % 2 ? 0.008 : 0.013, null, music.bus);   // 잔잔한 하이햇
  }
  if (Math.random() < 0.12) noiseBurst(t + Math.random() * 0.2, 0.004, 2500, 'highpass', 0.012, null, music.bus);   // 레코드 지직
  // 브라스: 4마디마다 한 번쯤, 첫 박에서 짧은 소절
  if (s === 0 && bar % 4 === 0 && mood.horn && Math.random() < 0.7) {
    let tt = t;
    for (const [m, beats] of pick(MOTIFS)) {
      if (m) brass(tt, m, beats * BEAT * 0.92, 0.028);
      tt += beats * BEAT;
    }
  }
}
function musicTick() {
  if (!music.playing) return;
  const now = ac.currentTime, mood = musicMood();
  if (stepTime(music.step) < now - 0.5) {   // 탭이 오래 멈췄다 돌아오면 밀린 음을 한꺼번에 치지 않고 다음 마디부터
    const bars = Math.ceil((now - music.t0) / (BEAT * 4));
    music.step = bars * 8;
  }
  while (stepTime(music.step) < now + 1.2) {   // 조금 앞서 예약 (백그라운드에서 타이머가 늦어도 끊기지 않게)
    musicStep(music.step, mood);
    music.step++;
  }
  music.bus.gain.setTargetAtTime(musicOn ? mood.vol : 0, now, 0.8);
}
function startMusic() {
  if (!ac || music.playing) return;
  musicBus();
  music.playing = true;
  const now = ac.currentTime;
  music.t0 = now + 0.2; music.step = 0;
  music.timer = setInterval(musicTick, 250);
  musicTick();
  if (musicOn) setFan(FAN_MUSIC, 3);
}
function stopMusic(fade = 2.5) {
  if (!music.playing) return;
  music.playing = false;
  clearInterval(music.timer);
  music.bus.gain.cancelScheduledValues(ac.currentTime);
  music.bus.gain.setTargetAtTime(0, ac.currentTime, fade / 3);
}

function speak(text) {
  if (!voiceOn || !soundOn || !window.speechSynthesis || !/[가-힣a-z]/i.test(text)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/~/g, ''));
    u.lang = 'ko-KR'; u.pitch = 1.7; u.rate = 1.05;
    const v = speechSynthesis.getVoices().find((x) => /^ko/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- 시작 화면 ---------- */
const FRONT = ['졸린', '숨은', '지친', '몰래', '탈출한', '3분만', '들킨', '버티는', '멍한', '꿀잠꾸는'];
const BACK = ['젖병', '기저귀', '물티슈', '유모차', '이유식', '공룡양말', '쪽쪽이', '아기띠', '장난감', '턱받이'];
const pick = (a) => a[Math.floor(Math.random() * a.length)];
function randomNick() {

const nickInput = $('#nick');

  ? FRONT[saved.pub[0]] + BACK[saved.pub[1]] : null;
nickInput.value = saved && isDiceNick(saved.nickname) ? saved.nickname : savedPub || randomNick();

// 옷·슬리퍼 색 고르기 — 고른 모습을 작은 화면으로 보여 줌. 옷을 안 고르면 엄마/아빠 기본색
const okIdx = (v, n) => Number.isInteger(v) && v >= 0 && v < n;
app.look = {
  shirt: saved && okIdx(saved.shirt, SHIRTS.length) ? saved.shirt : null,
  slipper: saved && okIdx(saved.slipper, SLIPPERS.length) ? saved.slipper : Math.floor(Math.random() * SLIPPERS.length),
};
const shirtOf = () => (app.look.shirt === null ? DEFAULT_SHIRT[app.role || 'mom'] : app.look.shirt);
let lookR = null, lookScene = null, lookCam = null, lookCh = null;
function buildLook() {
  if (!lookR) {
    lookR = new THREE.WebGLRenderer({ canvas: $('#lookCanvas'), antialias: true, alpha: true });
    lookR.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    lookR.setSize(84, 112, false);

    lookScene = new THREE.Scene();
    lookScene.add(new THREE.HemisphereLight(0xffffff, 0xBFD9CE, 1.6));
    const l = new THREE.DirectionalLight(0xFFF6EA, 1.1); l.position.set(2, 4, 5); lookScene.add(l);
    lookCam = new THREE.PerspectiveCamera(30, 84 / 112, 0.1, 20);

function disposeCharacter(ch, parent) {

}
function closeLook() {

function swatches(row, colors, names, kind) {
  return colors.map((color, i) => {
    const b = document.createElement('button');

    else if (d > 0.001) { const step = Math.min(d, WALK_SPEED * 1.25 * dt); w.x += (dx / d) * step; w.z += (dz / d) * step; }

async function startKid() {
  const type = Math.random() < 0.55 ? 'call' : 'toy';
  const x = stallX(app.stall) + rand(-0.18, 0.18);
  if (app.action === 'nap') { setAction(null); toast('깜짝! 잠이 깼어요', 1800); }
  app.kid = { type, level: 1, hiding: false, toy: null };
  updateMyWindow();
  stallUI.hidden = true;
  sfx.steps(true);
  await wait(1500);
  let toyInfo = null;
  if (type === 'toy') {
    toyInfo = pick(TOYS);
    removeLeftToy();
    app.kid.toy = makeToy(toyInfo.kind);
    scene.add(app.kid.toy);
    lookAtDoorFloor();
    sfx.roll(0);
    await rollToy(app.kid.toy, 0.45, TOY_STOP_Z, x);
    kidSay(fill(pick(TOY_LINES), toyInfo.name));
  } else {
    kidSay(fill(pick(CALL_LINES)));
  }
  let result = null;   // give | reply | hidden | caught
  while (!result) {
    const toyFirst = type === 'toy' && app.kid.level === 1;
    const choice = toyFirst
      ? await askKid(`${toyInfo.emoji} 돌려주기`, '🤫 모른 척하기')
      : await askKid('응, 금방 나가~', '🤫 숨죽이기');
    if (choice === 'a') { result = toyFirst ? 'give' : 'reply'; break; }
    app.kid.hiding = true; updateMyWindow();
    kidSay('…?');
    await wait(2600);
    if (Math.random() < (app.kid.level === 1 ? 0.6 : 0.5)) result = 'hidden';
    else if (app.kid.level === 1) {
      app.kid.level = 2; app.kid.hiding = false; updateMyWindow();
      kidSay(fill(pick(LOUD_LINES)), true);
    } else result = 'caught';
  }
  const toy = app.kid.toy;
  const toyOut = () => { if (!toy) return; sfx.roll(0); rollToy(toy, TOY_STOP_Z, 0.45, x).then(() => scene.remove(toy)); };
  app.kid.hiding = false; updateMyWindow();
  if (result === 'give') {
    kidHide(); toyOut(); await wait(1100);
    kidSay('고마워~!'); toast('장난감을 슬쩍 돌려줬어요', 2200);
  } else if (result === 'reply') {
    app.stats.caught++;
    kidSay('응! 빨리 와~'); toast('시간을 조금 벌었어요', 2200); toyOut();
  } else if (result === 'hidden') {
    app.stats.hidden++;
    kidSay(type === 'toy' ? '에이, 나중에 찾아야지…' : '어? 없나…');
    toast('휴, 안 들켰어요', 2200);
    if (toy) leftToy = toy;   // 장난감은 칸 안에 남음
  } else {
    app.stats.caught++;
    kidSay(type === 'toy' ? `찾았다! ${roleWord()}, 내 장난감!` : `찾았다! ${roleWord()}!`, true);
    toast('들켰어요… 그래도 조금만 더 쉬어요', 2600); toyOut();
  }
  await wait(1800);
  kidHide();
  sfx.steps(false);
  await wait(900);
  endKid();
}
function endKid() {
  app.kid = null;

async function renderCard(info) {

  g.fillStyle = '#23966F'; g.beginPath(); g.arc(L + 42, cy + 108, 13, 0, Math.PI * 2); g.fill();

  fitFont(g, info.time, JUA, 190, Rx - L); g.fillText(info.time, L - 4, cy + 780);

const joyEl = $('#joy'), knob = joyEl.querySelector('.knob');
const joy = { id: null, x: 0, y: 0 }, JOY_R = 40;
function moveJoy(e) {
  const b = joyEl.getBoundingClientRect();
  let dx = e.clientX - (b.left + b.width / 2), dy = e.clientY - (b.top + b.height / 2);
  const d = Math.hypot(dx, dy);
  if (d > JOY_R) { dx *= JOY_R / d; dy *= JOY_R / d; }
  joy.x = dx / JOY_R; joy.y = dy / JOY_R;
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
}
function endJoy() { joy.id = null; joy.x = joy.y = 0; knob.style.transform = ''; }

// 잠깐 팔 동작 (노크: 칸막이 쪽으로 톡톡, 휴지: 옆으로 뻗어 건네기). side +1 = 화면 오른쪽 칸
me.gesture = null;
function gesture(type, side, ms) { const now = performance.now(); me.gesture = { type, side, start: now, until: now + ms }; }
function applyGesture(now) {
  const g = me.gesture;
  if (!g) return;
  if (now > g.until) { me.gesture = null; return; }
  const k = (now - g.start) / (g.until - g.start), env = Math.sin(Math.PI * k);   // 부드럽게 뻗었다 돌아옴
  const arm = me.ch.arms[g.side > 0 ? 1 : 0];
  arm.rotation.z += g.side * (g.type === 'give' ? 0.8 : 1.1) * env;
  arm.rotation.x -= (g.type === 'give' ? 0.9 : 0.35 + Math.max(0, Math.sin(k * Math.PI * 6)) * 0.3) * env;
}
function updateMe(now, dt) {
  if (me.tag) {   // 이름표는 서 있거나 걸을 때만
    me.tag.visible = me.ch.root.visible && !me.seated && app.state !== 'ending';   // 거울 앞(엔딩)에서는 숨김
    me.tag.position.set(me.x, 1.47, me.z);   // 똥머리 바로 위
  }
  if (!me.ch || !me.ch.root.visible) { meFx.visible = false; return; }
  const fxE = me.seated && app.action === 'nap' ? 'Zzz' : me.seated && app.action === 'zone' ? '☁️' : '';
  if (fxE !== meFxCur) { meFxCur = fxE; if (fxE) drawMeFx(fxE); }
  meFx.visible = !!fxE;
  if (fxE) meFx.position.set(me.x + 0.2 + Math.sin(now * 0.0013) * 0.03, 1.32 + Math.sin(now * 0.002) * 0.03, me.z + 0.1);
  if (me.seated) {
    poseCharacter(me.ch, seatPose(), now / 1000, dt);
    applyGesture(now);

  }
  let mx = 0, mz = 0;
  if (me.target) {   // 정해진 곳까지 걸어가기 (칸 드나들 때)

    if (d <= step) { me.x = t.x; me.z = t.z; me.target = null; t.res(); }
    else { mx = dx / d; mz = dz / d; me.x += mx * step; me.z += mz * step; }
  } else if (app.state === 'corridor') {   // 화면 위쪽 = 칸 쪽(-z), 오른쪽 = +x
    mx = (keys.has('r') ? 1 : 0) - (keys.has('l') ? 1 : 0) + joy.x;

}

// 카메라: 캐릭터 뒤 위쪽에서 부드럽게 따라옴 (방향은 늘 칸 쪽을 봄)
const camLook = new V3(0, 1.15, -0.8);
function followPose(x, z) {
  const portrait = camera.aspect < 1;
  const back = portrait ? 4.3 : 3.4, up = portrait ? 2.85 : 2.6;
  const p = new V3(clamp(x * 0.85, -2.8, 2.8), up, Math.min(z + back, ROOM.front - 0.3));
  const t = new V3(x, 0.7, z - 0.9);
  return { p, t, q: lookQ(p, t), fov: portrait ? 62 : 50 };
}
function followCam(dt) {
  const f = followPose(me.x, me.z), k = 1 - Math.exp(-dt * 4);
  if (![camera.position.x, camera.position.y, camera.position.z].every(Number.isFinite)) camera.position.copy(f.p);   // 망가진 위치면 바로 제자리로
  camera.position.lerp(f.p, k);
  camLook.lerp(f.t, k);
  camera.lookAt(camLook);
  if (Math.abs(camera.fov - f.fov) > 0.05) { camera.fov += (f.fov - camera.fov) * k; camera.updateProjectionMatrix(); }
}
// 지금 카메라에서 따라가기 자리까지 옮겨 감
function cameraToFollow(dur) {
  const p0 = camera.position.clone(), q0 = camera.quaternion.clone(), f0 = camera.fov;
  return tween(0, dur, (k) => {
    const f = followPose(me.x, me.z);
    camera.position.lerpVectors(p0, f.p, k);
    camera.quaternion.slerpQuaternions(q0, f.q, k);
    camera.fov = f0 + (f.fov - f0) * k; camera.updateProjectionMatrix();
  }).then(() => { camLook.copy(followPose(me.x, me.z).t); });
}

// 문으로 걸어 들어가면 자동으로 입장. 지나가다 실수로 들어가지 않게 문 바로 앞에서 문 쪽으로 0.25초 밀어야 함
const doorAt = (x) => { for (let i = 0; i < N; i++) if (Math.abs(x - stallX(i)) < 0.4) return i; return -1; };
function tryDoor(i) {
  if (npcs.has(i)) { sfx.knock(0, 0.5); toast(`${i + 1}번 칸은 사용 중이에요`, 1800); return; }
  if (net.state === 'connecting') { toast('빈자리를 살피는 중이에요. 잠깐만요', 1800); return; }
  enterStall(i);
}
let pushIdx = -1, pushT = 0;
function checkDoorPush(mz, dt) {
  const i = me.z < BOUNDS.z0 + 0.06 ? doorAt(me.x) : -1;
  if (i < 0 || mz > -0.3) { pushIdx = -1; pushT = 0; return; }
  if (pushIdx !== i) { pushIdx = i; pushT = 0; }
  pushT += dt;
  if (pushT > 0.25) { pushT = -1.5; tryDoor(i); }   // 사용 중이면 계속 밀어도 1.75초마다만 알림
}

// 마우스·터치: 바닥을 누르면 그곳으로, 누른 채 끌면 따라 걷기, 문을 누르면 문 앞까지 가서 들어감
me.goal = null;   // { x, z, door, stuck }

  new THREE.MeshBasicMaterial({ color: '#5E4FAE', transparent: true, opacity: 0.75, depthWrite: false }));

scene.add(goalRing);
const floorPlane = new THREE.Plane(new V3(0, 1, 0), 0), floorHit = new V3();
function pointGoal(e, doorsToo) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = doorsToo && raycaster.intersectObjects(doorHits, false)[0];
  if (hit) { const i = hit.object.userData.stall; me.goal = { x: stallX(i), z: 0.75, door: i, stuck: 0 }; return; }
  if (!raycaster.ray.intersectPlane(floorPlane, floorHit)) return;   // 바닥 위(벽·천장)를 누름
  me.goal = { x: clamp(floorHit.x, BOUNDS.x0, BOUNDS.x1), z: clamp(floorHit.z, BOUNDS.z0, BOUNDS.z1), door: -1, stuck: 0 };

    me.goal = null;
    if (d < 0.06 && g.door >= 0) tryDoor(g.door);

  }

let installPrompt = null;   // 안드로이드 크롬 등: 바로 설치 창을 띄울 수 있음
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installBtn.hidden = true; track('app_installed'); toast('홈 화면에 화캉스를 두었어요', 2400); });
installBtn.addEventListener('click', async () => {
  sfx.tap();
  if (installPrompt) {
    installPrompt.prompt();
    const r = await installPrompt.userChoice.catch(() => null);
    track('install_click', { way: 'prompt', result: (r && r.outcome) || 'unknown' });
    installPrompt = null;
    return;
  }
  // 설치 창을 띄울 수 없는 곳은 방법을 안내
  const ua = navigator.userAgent;
  const msg = /KAKAOTALK/i.test(ua) ? '카톡 안에서는 안 돼요. 오른쪽 아래 ⋯ → 다른 브라우저로 열기 → 홈 화면에 추가'
    : /iPhone|iPad|iPod/.test(ua) ? '아래 공유 버튼(⬆︎) → 홈 화면에 추가를 눌러 주세요'
    : '브라우저 메뉴(⋮) → 홈 화면에 추가를 눌러 주세요';
  track('install_click', { way: 'guide' });
  toast(msg, 6000);
});
if (new URLSearchParams(location.search).get('src') === 'homescreen') track('open_from_home');   // 홈 화면 아이콘으로 들어옴
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

/* ---------- 칸 들어가기 / 나가기 ---------- */
const stallUI = $('#stallUI');
const lockBtn = $('#lockBtn');
const exitBtn = $('#exitBtn');
const flushBtn = $('#flushBtn');
const knockBtn = $('#knockBtn');
const tissueBtn = $('#tissueBtn');
const timerEl = $('#timer');

let claiming = false;
async function enterStall(i) {
  if (app.state !== 'corridor' || claiming) return;
  if (net.state === 'on') {   // 같은 칸에 두 사람이 동시에 들어가지 않게 서버 확인을 먼저 받음
    claiming = true;
    const ok = await netClaim(i);
    claiming = false;
    if (app.state !== 'corridor') return;
    if (ok === false || npcs.has(i)) { sfx.knock(0, 0.6); toast('방금 다른 엄빠가 들어갔어요. 다른 칸을 골라 주세요'); return; }
    net.sent = { a: null, k: null };
  }
  app.state = 'entering'; app.stall = i;
  hideToast(); sfx.tap();
  const sx = stallX(i), door = doors[i];
  stallLight.position.set(sx, 2.4, -0.85);
  setFan(0.34, 2.2);
  // 문 앞까지 걸어가 문을 열고, 안으로 들어가 돌아섬 (카메라는 계속 뒤에서 따라옴)
  await walkTo(sx, Math.min(me.z, 0.75));   // 이미 문에 붙어 있으면 뒤로 물러나지 않음 (열리는 문은 캐릭터에 닿지 않음)
  await turnFully(Math.PI, 0.2);
  tween(0, 0.5, (k) => { door.g.rotation.y = -1.35 * k; });
  sfx.swoosh();
  await wait(300);
  await walkTo(sx, -0.95);
  tween(0, 0.8, (k) => { stallLight.intensity = 1.6 * k; });
  await turnFully(0, 0.45);
  tween(0, 0.55, (k) => { door.g.rotation.y = -1.35 * (1 - k); }).then(sfx.thud);
  await wait(250);
  // 변기에 앉고, 카메라는 내 칸 위 고정 시점으로. 거의 다 오면 양옆 칸막이를 천장까지 가려 옆 칸이 안 보이게
  me.follow = false;
  me.seated = true;
  const z0 = me.z;
  tween(0, 0.5, (k) => { me.z = z0 + (SEAT_Z - z0) * k; });
  const c = stallCamPose(i), p0 = camera.position.clone(), q0 = camera.quaternion.clone(), f0 = camera.fov;
  await tween(0, 1.0, (k) => {
    camera.position.lerpVectors(p0, c.p, k);
    camera.quaternion.slerpQuaternions(q0, c.q, k);
    camera.fov = f0 + (c.fov - f0) * k; camera.updateProjectionMatrix();
    if (k > 0.85) setShields(true);
  });
  app.state = 'stall';
  track('stall_enter', { stall: i + 1 });
  app.locked = false;
  renderStallUI();
  stallUI.hidden = false;
}

async function exitStall(opts = {}) {
  if (app.state !== 'stall' || app.locked) return;
  app.state = 'leaving';
  if (opts.ending !== true) netSend({ t: 'out', flush: false });   // 물 내린 경우는 flush()에서 이미 보냄
  hideToast(); sfx.tap();
  stallUI.hidden = true;
  const sx = stallX(app.stall), door = doors[app.stall];
  const ending = opts.ending === true;
  tween(0, 0.5, (k) => { door.g.rotation.y = -1.35 * k; });
  sfx.swoosh();
  setFan(0.2, 2);
  tween(0, 0.8, (k) => { stallLight.intensity = 1.6 * (1 - k); });
  setShields(false);
  me.seated = false;
  if (!ending) {   // 일어나 걸어 나오고, 카메라는 뒤로 물러나 따라가기 자리로
    await wait(350);   // 문이 먼저 열림
    const out = walkTo(sx, 1.0);
    await cameraToFollow(1.3);
    await out;
    tween(0, 0.5, (k) => { door.g.rotation.y = -1.35 * (1 - k); }).then(sfx.thud);
    app.stall = -1;
    me.follow = true;
    app.state = 'corridor';
    return;
  }
  // 물 내리고 나오면: 걸어 나와 세면대 거울 앞까지 가서 거울을 봄 → "자, 다시 육아 출근"
  await wait(350);
  const out = walkTo(sx, 1.0);
  await cameraToFollow(1.3);
  me.follow = true;
  await out;
  tween(0, 0.5, (k) => { door.g.rotation.y = -1.35 * (1 - k); }).then(sfx.thud);
  app.stall = -1;
  await walkTo(MIRROR_SPOT.x, MIRROR_SPOT.z);
  await turnFully(-Math.PI / 2, 0.45);   // 거울(왼쪽 벽) 쪽으로 돌아섬
  me.follow = false;
  const c = mirrorPose(), p0 = camera.position.clone(), q0 = camera.quaternion.clone(), f0 = camera.fov;
  await tween(0, 1.2, (k) => {
    camera.position.lerpVectors(p0, c.p, k);
    camera.quaternion.slerpQuaternions(q0, c.q, k);
    camera.fov = f0 + (c.fov - f0) * k; camera.updateProjectionMatrix();
  });
  app.state = 'ending';
  runEnding();
}
const MIRROR_SPOT = { x: -3.05, z: 3.6 };   // 세면대 앞 (거울 글자가 머리 위로 보이는 자리)

function lockDoor() {
  if (app.state !== 'stall' || app.locked) return;
  const d = doors[app.stall];
  app.locked = true;
  app.lockStart = performance.now();
  app.action = null;
  app.stats = { tiles: 0, knocks: 0, tissueGiven: 0, tissueGot: 0, caught: 0, hidden: 0 };
  app.npcEventAt = performance.now() + rand(15000, 30000);
  app.kidEventAt = performance.now() + rand(40000, 60000);
  sfx.click();
  startMusic();   // 문을 잠그면 나만의 시간 — 음악이 서서히 들어옴
  track('door_lock');
  tween(0, 0.18, (k) => { d.bolt.position.x = d.boltX + 0.06 * k; });
  d.indicator.material.color.set('#D9443A');
  drawWindow(d.winTex, 'occupied');
  timerEl.hidden = false;
  renderStallUI();
  toast('딸깍. 화캉스 시작! 아래에서 할 일을 골라 보세요', 3200);
}
function renderStallUI() {
  const L = app.locked;
  exitBtn.hidden = L; lockBtn.hidden = L;
  knockBtn.hidden = !L; tissueBtn.hidden = !L; flushBtn.hidden = !L;
  trayBtns.forEach((b) => { b.disabled = !L; b.setAttribute('aria-pressed', 'false'); });
}
let flushing = false;
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function flush() {
  if (app.state !== 'stall' || !app.locked || flushing) return;
  stopMusic();
  setAction(null);
  clearNudge();
  removeLeftToy();
  flushing = true;
  app.lastRun = { secs: Math.floor((performance.now() - app.lockStart) / 1000), stats: { ...app.stats } };
  flushBtn.disabled = true;
  sfx.flush();
  netSend({ t: 'out', flush: true });
  toast('쏴아아…', 2000);
  await wait(1800);
  const d = doors[app.stall];
  sfx.click();
  tween(0, 0.18, (k) => { d.bolt.position.x = d.boltX + 0.06 * (1 - k); });
  d.indicator.material.color.set('#23966F');
  drawWindow(d.winTex, 'vacant');
  app.locked = false;
  timerEl.hidden = true;
  timerNum.textContent = '00:00';
  lastSec = -1;
  await wait(300);
  flushBtn.disabled = false;
  flushing = false;
  exitStall({ ending: true });
}
const sheet = $('#confirm'), sheetTitle = $('#confirmTitle');
function openConfirm() {
  if (app.state !== 'stall' || !app.locked || flushing) return;
  sfx.tap();
  const s = Math.floor((performance.now() - app.lockStart) / 1000), m = Math.floor(s / 60), r = s % 60;
  sheetTitle.textContent = m ? `${m}분 ${r}초 쉬었어요` : `${r}초 쉬었어요`;
  sheet.hidden = false;
  $('#stayBtn').focus();
}
const closeConfirm = () => { sheet.hidden = true; };
flushBtn.addEventListener('click', openConfirm);
$('#stayBtn').addEventListener('click', () => { sfx.tap(); closeConfirm(); });
$('#leaveBtn').addEventListener('click', () => { closeConfirm(); flush(); });
sheet.addEventListener('click', (e) => { if (e.target === sheet) closeConfirm(); });
window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !sheet.hidden) closeConfirm(); });
knockBtn.addEventListener('click', () => knock());
tissueBtn.addEventListener('click', giveTissue);
lockBtn.addEventListener('click', lockDoor);
exitBtn.addEventListener('click', exitStall);

/* ---------- 입력: 드래그로 둘러보기, 탭으로 선택 ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let drag = null;
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch') touchUI = true;   // 터치하면 조이스틱을 보여 줌
  drag = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, moved: 0, id: e.pointerId };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* 이미 끝난 포인터 */ }
  if (app.state === 'corridor') pointGoal(e, true);   // 바닥이나 문을 눌러 걷기
});
canvas.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
  drag.lx = e.clientX; drag.ly = e.clientY;
  drag.moved += Math.abs(dx) + Math.abs(dy);
  if (app.state === 'corridor' && drag.moved > 10) pointGoal(e, false);   // 누른 채 끌면 따라 걷기
});
canvas.addEventListener('pointerup', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const tap = drag.moved < 10;
  drag = null;
  if (!tap) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (app.state === 'stall' && !app.locked) {
    const d = doors[app.stall];
    if (raycaster.intersectObjects([d.bolt, d.lockPlate, d.indicator], false).length) lockDoor();
  } else if (app.state === 'stall') {
    if (app.kid && app.kid.toy && app.kid.type === 'toy' && app.kid.level === 1 && !kidChoice.hidden) {
      const toyHit = raycaster.intersectObject(app.kid.toy, true)[0];
      if (toyHit) { pickChoice('a'); return; }   // 장난감을 직접 눌러 돌려주기
    }
    if (PERSIST.has(app.action)) { setAction(null); return; }   // 화면을 누르면 하던 일 그만
    const L = partitions[app.stall], Rp = partitions[app.stall + 1];
    const hit = raycaster.intersectObjects([L, Rp, ...shields], false)[0];
    if (hit) knock(hit.object === L || hit.object === shields[0] ? -1 : 1);   // 칸막이를 탭해서 노크
  }
});
canvas.addEventListener('pointercancel', () => { drag = null; });

/* ---------- 크기 ---------- */
function resize() {
  if (!innerWidth || !innerHeight) return;   // 창이 잠깐 0 크기가 되면 비율이 깨져 카메라 위치가 NaN이 됨
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  if (app.state === 'start') applyCorridor();
  else if (app.state === 'stall') {
    const c = stallCamPose(app.stall);
    camera.position.copy(c.p); camera.quaternion.copy(c.q); camera.fov = c.fov; camera.updateProjectionMatrix();
  }
  else if (app.state === 'ending') {
    const m = mirrorPose();
    camera.position.copy(m.p); camera.quaternion.copy(m.q); camera.fov = m.fov; camera.updateProjectionMatrix();
  }
}
window.addEventListener('resize', resize);
resize();

/* ---------- 루프 ---------- */
let prev = performance.now();
const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const timerNum = timerEl.querySelector('span');
let lastSec = -1;
function loop(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  runTweens(now);
  for (const v of vents) v.rotation.y += dt * 7;
  updateNpcs(now, dt);
  updateMe(now, dt);
  updateWalkers(now, dt);
  netMove(now);
  if (me.follow) followCam(dt);
  updateCorridorUI();
  if (lookCh) {   // 시작 화면의 내 모습 미리보기
    poseCharacter(lookCh, 'stand', now / 1000, dt);
    lookCh.root.rotation.y = Math.sin(now * 0.0006) * 0.5;
    lookR.render(lookScene, lookCam);
  }
  updateNpcEvents(now);
  updateKid(now);
  if (app.state === 'start') {
    const c = corridorPose();
    camera.position.set(c.p.x + Math.sin(now * 0.00035) * 0.12, c.p.y, c.p.z);
  }
  if (app.locked) {
    const s = Math.floor((now - app.lockStart) / 1000);
    if (s !== lastSec) { lastSec = s; timerNum.textContent = fmt(s); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 웹폰트가 늦게 불러와지면 3D 안의 글자를 다시 그림
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => doors.forEach((d, i) => {
    if (npcs.has(i)) { const n = npcs.get(i); renderNpc(n); drawTag(n.tagTex, tagText(n)); }
    else if (i === app.stall) updateMyWindow();
    else drawWindow(d.winTex, 'vacant');
    drawPlate(d.plateTex, i + 1);
  }));
  document.fonts.ready.then(drawMirrorText);
  document.fonts.ready.then(() => { if (me.tag) drawTag(me.tagTex, myTagText(), true); });
}
</script>
</body>
